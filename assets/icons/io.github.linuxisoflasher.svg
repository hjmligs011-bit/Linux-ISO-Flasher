<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Linux ISO Flasher</title>
  <desc id="desc">Disco óptico, conector USB e raio sobre fundo escuro.</desc>
  <rect width="128" height="128" rx="28" fill="#1e1e2e"/>
  <!-- Disco: trilha externa, trilha interna e centro -->
  <circle cx="50" cy="70" r="34" fill="none" stroke="#89b4fa" stroke-width="9"/>
  <circle cx="50" cy="70" r="18" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.45"/>
  <circle cx="50" cy="70" r="7" fill="#a6e3a1"/>
  <!-- Conector USB estilizado -->
  <g transform="rotate(28 96 34)">
    <rect x="90" y="10" width="12" height="9" rx="2" fill="#a6e3a1"/>
    <rect x="86" y="19" width="20" height="22" rx="5" fill="#89b4fa"/>
    <path d="M91 26h10M91 31h10" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- Raio de gravação -->
  <path d="M94 48 72 82h15l-6 26 24-38H89Z" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="3" stroke-linejoin="round"/>
</svg>
